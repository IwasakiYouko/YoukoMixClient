display_name: 人间之里
package_name: YoukoMix
maintainer:
  name: YoukoMix
  email: support@youkomix.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now youkomix-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/youkomix-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/youkomix

keywords:
  - YoukoMix
  - 人间之里
  - Proxy

generic_name: 人间之里

categories:
  - Network

startup_notify: true

startup_wm_class: com.youkomix.client
